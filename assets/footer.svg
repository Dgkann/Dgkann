<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="End of transmission">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5c4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f5c4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#00f5c4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .eof { font: 600 15px 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; fill: #00a884; letter-spacing: 4px; }
  </style>
  <rect x="0" y="30" width="1200" height="1.5" fill="url(#line)"/>
  <circle cy="31" r="4" fill="#00f5c4" filter="url(#glow)">
    <animate attributeName="cx" values="120;1080;120" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="70" text-anchor="middle" class="eof">// END OF TRANSMISSION · THANKS FOR STOPPING BY</text>
</svg>
